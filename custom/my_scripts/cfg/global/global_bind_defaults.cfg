// resets any "oddball binds" from other class configurations in a more manageable way

// movement: ESDF+A > WASD+CTRL
bind e +forward;
bind s +moveleft;
bind d +back;
bind f +moveright;
bind a +duck;
bind r +use_action_slot_item;

// reset jump in case last class was scout
bind space +jump;

// enable autoreload and rezoom
cl_autoreload 1;
cl_autorezoom 1;

// bind mouse buttons to their appropriate attack functions, and stop attacking
bind mouse1 +attack;
-attack;
bind mouse2 +attack2;

// rebind mouse3 to +jump (mouse3 is a quick destroy/rebuild bind for engineer's sentry on engie)
unbind mouse3; bind mouse3 +jump;

// reset number binds but offset them by 1 so as to not make
// weapon switching awkward with the ESDF+A layout
unbind 2; bind 2 slot1;
unbind 3; bind 3 slot2;
unbind 4; bind 4 slot3;
unbind 5; bind 5 slot4;
unbind 6; bind 6 slot5;
unbind 7; bind 7 slot6;
unbind 8; bind 8 slot7;
unbind 9; bind 9 slot8;
unbind 0; bind 0 slot9;
unbind 1; bind 1 slot10;

// ensure arrow keys are still fast swaps for inventory presets A-D
bind uparrow "load_itempreset 0;"
bind leftarrow "load_itempreset 1;"
bind rightarrow "load_itempreset 2;"
bind downarrow "load_itempreset 3;"

// misc
bind w +inspect
bind p "say_party"
bind f2 show_quest_log

// vim: syntax=c
